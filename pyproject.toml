[build-system]
requires = [
    "setuptools >= 61.2",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "stpsf"
description = "Creates simulated point spread functions for Space Telescopes (James Webb, Roman)"
authors = [
    { name = "STPSF developers, at Space Telescope Science Institute and elsewhere" },
]
license-files = ["LICENSE.md"]
dynamic = [
    "version",
]
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.0",
    "astroquery>=0.4.8",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "photutils>=2.0",
    "poppy>=1.2",
    "pysiaf>=0.24",
    "scipy>=1.15",
    "synphot>=1.5",
]
[project.optional-dependencies]
test = [
    "pytest>=9.0",
]
docs = [
    "nbsphinx",
    "pandoc",
    "sphinx",
    "sphinx-astropy",
    "sphinx-automodapi",
    "sphinx-issues",
    "stsci_rtd_theme",
]
jwst = [
    "jwst",
]
roman= [
    "roman_datamodels",
]


[project.urls]
Homepage = "http://stpsf.readthedocs.io/"
github_project = "https://github.com/spacetelescope/stpsf"

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "*.fits", "*.csv", "scripts/"
]
"stpsf.tests" = [
    "data/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["docs/_build/","build/"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "stpsf/version.py"

[tool.pytest]
minversion = "9.0"
testpaths = [
    "stpsf/tests",
]
norecursedirs = [
    "build",
    "docs/_build",
]
astropy_header = true
doctest_plus = "enabled"
text_file_format = "rst"
addopts = ["-p no:warnings"]

[tool.coverage.run]
source = [
    "stpsf",
]
omit = [
    "stpsf/conftest*",
    "stpsf/tests/*",
    "stpsf/*/tests/*",
    "stpsf/*/*/tests/*",
    "stpsf/version*",
    "*/stpsf/conftest*",
    "*/stpsf/tests/*",
    "*/stpsf/*/tests/*",
    "*/stpsf/*/*/tests/*",
    "*/stpsf/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main(.*):",
    "pragma: py{ignore_python_version}",
]
omit = [
    "stpsf/conftest*",
    "stpsf/tests/*",
    "stpsf/*/tests/*",
    "stpsf/*/*/tests/*",
    "stpsf/version*",
    "*/stpsf/conftest*",
    "*/stpsf/tests/*",
    "*/stpsf/*/tests/*",
    "*/stpsf/*/*/tests/*",
    "*/stpsf/version*",
]

[tool.ruff]
line-length = 120          # scientific code with array literals often wants more room than 88
target-version = "py311"   # match whatever you actually run

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "NPY", # numpy-specific rules, if you use numpy
]
ignore = [
    "E501",  # line too long — formatter handles this; don't fight it on data literals
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # notebooks often have imports after code cells

[tool.ruff.format]
quote-style = "double"
