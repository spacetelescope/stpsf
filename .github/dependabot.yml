version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: monthly
    time: "10:00"
  groups:
    actions:
      patterns:
        - "*"

- package-ecosystem: github-actions
  directory: ".github/workflows"
  schedule:
    interval: monthly
    time: "10:00"
  groups:
    actions:
      patterns:
        - "*"